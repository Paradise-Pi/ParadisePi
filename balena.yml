name: Paradise
description: 'Facility control panel for sACN & OSC'
type: sw.application
assets:
    repository:
        type: blob.asset
        data:
            url: 'https://github.com/Paradise-Pi/ParadisePi'
    logo:
        type: blob.asset
        data:
            url: 'https://github.com/Paradise-Pi/ParadisePi/blob/cfa040078f2c4d592c611a7313760961e4fdffa5/icon/icon.png'
data:
    applicationConfigVariables:
        - RESIN_HOST_CONFIG_disable_splash: 0
    applicationEnvironmentVariables:
        - SHOW_CURSOR: 0
    defaultDeviceType: raspberrypi4-64
    supportedDeviceTypes:
        - raspberrypi4-64
        - raspberrypi3-64
        - raspberrypi400-64
        - raspberrypi5
version: 3.0.0
